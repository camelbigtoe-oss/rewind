<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>REWIND TV</title>
  <meta name="description" content="90s pop trivia on the coolest channel that never existed. TV, toons, music, movies and toys." />
  <meta name="theme-color" content="#2ab0ff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="saturday">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="frame" aria-hidden="true"><i class="ant"></i><i class="knobs"></i></div>
  <div id="tv">
    <div id="osd" aria-hidden="true"><span id="osd-l">PLAY ▶</span><span id="osd-r">CH 01</span></div>
    <main id="app"></main>
    <div id="bug" aria-hidden="true">REWIND<i>TV</i></div>
  </div>
  <canvas id="static" aria-hidden="true"></canvas>
  <div id="scan" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="bank.js"></script>
  <script src="q-tv.js"></script>
  <script src="q-toons.js"></script>
  <script src="q-music.js"></script>
  <script src="q-movies.js"></script>
  <script src="q-toys.js"></script>
  <script src="q-oz.js"></script>
  <script src="q-special.js"></script>
  <script src="pics.js"></script>
  <script src="avatar.js"></script>
  <script src="cast.js"></script>
  <script src="rpg.js"></script>
  <script src="audio.js"></script>
  <script src="fx.js"></script>
  <script src="rounds.js"></script>
  <script src="modes.js"></script>
  <script src="ui.js"></script>
</body>
</html>
